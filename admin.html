<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Painel administrativo — Vinho &amp; Harmonia</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" href="icons/icon-192.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ==================================================== cabeçalho ==== -->
  <header class="site-header">
    <div class="wrap">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">V&amp;H</div>
        <div class="brand-text">
          <h1>Painel administrativo</h1>
          <p class="brand-slogan">Pedidos — Vinho &amp; Harmonia</p>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap admin-main">

    <!-- ============================================ formulário de senha -->
    <section class="fieldset-block admin-login" id="admin-login">
      <div class="block-title">Acesso restrito</div>
      <form id="admin-login-form" novalidate>
        <div class="field">
          <label for="admin-password">Senha</label>
          <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
        </div>

        <div class="form-errors" id="admin-login-error" hidden></div>

        <button class="btn btn-gold btn-block" type="submit" id="admin-login-submit" style="margin-top:12px">Entrar</button>
      </form>
    </section>

    <!-- ============================================== frete — melhor envio -->
    <section class="fieldset-block admin-shipping" id="admin-shipping" hidden>
      <div class="block-title">Frete — Melhor Envio</div>
      <p id="melhor-envio-status">Verificando conexão…</p>
      <a class="btn btn-gold" id="melhor-envio-connect-link" href="/api/melhor-envio-connect" hidden>Conectar Melhor Envio</a>
    </section>

    <!-- ========================================================== assinantes -->
    <section class="fieldset-block admin-subscribers" id="admin-subscribers" hidden>
      <div class="block-title" id="sub-form-title">Assinantes</div>

      <form id="sub-form" novalidate>
        <div class="sub-grid">
          <div class="field sub-span-2">
            <label for="sub-name">Nome *</label>
            <input id="sub-name" name="name" type="text" maxlength="120" autocomplete="off">
          </div>
          <div class="field">
            <label for="sub-phone">Telefone *</label>
            <input id="sub-phone" name="phone" type="tel" inputmode="numeric" placeholder="(11) 98765-4321" autocomplete="off">
          </div>
          <div class="field">
            <label for="sub-email">E-mail</label>
            <input id="sub-email" name="email" type="email" maxlength="254" autocomplete="off">
          </div>
          <div class="field sub-span-2">
            <label for="sub-street">Endereço</label>
            <input id="sub-street" name="street" type="text" maxlength="120" autocomplete="off">
          </div>
          <div class="field sub-half">
            <label for="sub-complement">Complemento</label>
            <input id="sub-complement" name="complement" type="text" maxlength="120" autocomplete="off">
          </div>
          <div class="field sub-half">
            <label for="sub-number">Número</label>
            <input id="sub-number" name="number" type="text" maxlength="20" autocomplete="off">
          </div>
          <div class="field">
            <label for="sub-neighborhood">Bairro</label>
            <input id="sub-neighborhood" name="neighborhood" type="text" maxlength="120" autocomplete="off">
          </div>
          <div class="field">
            <label for="sub-city">Cidade</label>
            <input id="sub-city" name="city" type="text" maxlength="120" autocomplete="off">
          </div>
          <div class="field sub-half">
            <label for="sub-state">Estado</label>
            <input id="sub-state" name="state" type="text" maxlength="2" placeholder="SP" autocomplete="off">
          </div>
          <div class="field sub-half">
            <label for="sub-cep">CEP</label>
            <input id="sub-cep" name="cep" type="text" inputmode="numeric" maxlength="9" placeholder="01310-100" autocomplete="off">
          </div>
        </div>

        <div class="form-errors" id="sub-errors" hidden></div>
        <p class="orders-status" id="sub-status" hidden></p>

        <button class="btn btn-gold btn-block" type="submit" id="sub-submit" style="margin-top:12px">Cadastrar assinante</button>
        <button class="btn btn-ghost btn-block" type="button" id="sub-cancel" style="margin-top:8px" hidden>Cancelar edição</button>
      </form>

      <h3 class="sub-list-title">Cadastrados <span id="sub-count"></span></h3>
      <input type="search" id="sub-filter" class="search-input stock-filter" placeholder="Filtrar por nome, telefone ou e-mail…" aria-label="Filtrar assinantes" autocomplete="off">
      <div class="sub-list" id="sub-list"></div>
    </section>

    <!-- ============================================================== estoque -->
    <section class="fieldset-block admin-stock" id="admin-stock" hidden>
      <div class="block-title">Estoque</div>
      <p class="orders-status" id="stock-status" hidden></p>
      <input type="search" id="stock-filter" class="search-input stock-filter" placeholder="Filtrar vinho pelo nome…" aria-label="Filtrar vinho pelo nome" autocomplete="off">
      <div class="stock-list" id="stock-list"></div>
    </section>

    <!-- ==================================================== lista de pedidos -->
    <section class="admin-orders" id="admin-orders" hidden>
      <div class="admin-orders-head">
        <h2>Pedidos</h2>
      </div>

      <p class="orders-status" id="orders-status" hidden></p>

      <div id="orders-list"></div>
    </section>

  </main>

  <script src="js/catalog.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
